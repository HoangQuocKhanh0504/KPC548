<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoàng Quốc Khánh</title>
<link rel="icon" href="KHANHPC.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
--primary:#00ffcc;
--bg:#0f0f12;
--card:#1c1c22;
--text:#fff;
--border:#333;
--avatar-border-width:4px;
--avatar-border-color:#00ffcc;
}
body{margin:0;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;height:100vh;font-family:system-ui;}
.card{width:380px;padding:30px;border-radius:28px;text-align:center;background:var(--card);color:var(--text);}
.avatar-wrap{display:inline-block;border-radius:50%;border:none;}
.avatar-wrap.rgb{border:none;background: linear-gradient(270deg, red,orange,yellow,lime,cyan,blue,violet,red);background-size:400% 400%;animation:rgb 4s linear infinite;padding:4px;}
.avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;display:block;}
.links {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-height: 250px;
  overflow-y: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.links::-webkit-scrollbar {
  width: 0;
  background: transparent;
}

.links a{display:flex;gap:12px;align-items:center;padding:14px;margin:0;border-radius:16px;border:1px solid var(--border);text-decoration:none;color:inherit;}
.links a:hover{background:var(--primary);color:#fff;}
@keyframes rgb{0%{background-position:0%}100%{background-position:400%}}
</style>
</head>
<body>
<div class="card">
  <div class="avatar-wrap rgb">
    <img class="avatar" src="KHANHPC.png" alt="Hoàng Quốc Khánh">
  </div>
  <h1>Hoàng Quốc Khánh</h1>
